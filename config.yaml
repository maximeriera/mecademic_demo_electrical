# config.yaml — Electrical assembly demo
#
# Workspace for the Mecademic demo app. Run it with:
#   python <path to>/mecademic_demo_app/app.py --workspace <path to this folder>
# (or `docker compose up -d` from ~/demo_ws, which starts the app on this folder).
#
# What to do at the machine is in README.md.
#
# Every entry under `devices:` is checked at startup against
# mecademic_demo_app/devices/registry.py: an unknown type or a missing value
# is an error that blocks INITIALIZE, an unknown key is a warning and is
# ignored. Both show in a banner at the top of the UI. The keys each type
# accepts are listed in mecademic_demo_app/app_logic/config.yaml and returned
# by GET /api/devices/types.

title: "Electrical assembly demo"

# Params and variables (Variables tab) are declared in context.yaml, next to
# this file. Production history goes to logs/history/<this folder name>/.
# history:
#   enabled: true
#   retention_days: 30

# ============================================================
# DEVICES — names are the keys task code uses: devices["scara"]
# ============================================================
devices:

  # --- Robots ---
  screwdriver:                     # Meca500: screws the parts (program screwing_seq)
    type: "mecademic"
    ip_address: "192.168.0.101"

  dispenser:                       # Meca500: dispenses the glue bead (moves from prod.py)
    type: "mecademic"
    ip_address: "192.168.0.102"

  scara:                           # MCS500: places and removes the screen (programs place_screen / pick_screen)
    type: "mecademic"
    ip_address: "192.168.0.103"

  tester:                          # Meca500: runs the touch test pattern on the screen (moves from prod.py)
    type: "mecademic"
    ip_address: "192.168.0.104"

  # --- Transfer axis ---
  zaber:                           # Zaber linear axis carrying the part between stations
    type: "zaber"
    port: "/dev/ttyUSB0"                   # TODO: confirm. In the Docker container this is a Linux device
                                   # (e.g. /dev/ttyUSB0), which must also be passed to the container.
    # axis_number: 1               # optional, default 1

# ============================================================
# MANUAL ACTIONS — buttons on the Manual tab
# ============================================================
# Each key must be returned by get_manual_actions() in manual_actions.py,
# otherwise the app refuses to start this workspace.
manual_actions:
  - key: "screw_parts"
    label: "Screw parts"
    description: "Move the axis to the screwing station and run the screwing sequence."
    confirm_title: "Run the screwing station?"
    confirm_message: "The axis moves to the screwing station and the screwdriver robot runs screwing_seq. Keep clear of the cell."

  - key: "dispense_glue"
    label: "Dispense glue"
    description: "Move the axis to the dispensing station and dispense one glue bead."
    confirm_title: "Dispense glue?"
    confirm_message: "The axis moves to the dispensing station and the dispenser robot draws the glue path. Make sure a part is in place."

  - key: "test_screen"
    label: "Test screen"
    description: "Move the axis to the test station and run the touch test pattern."
    confirm_title: "Run the screen test?"
    confirm_message: "The axis moves to the test station and the tester robot touches the screen. Make sure a screen is in place."

# ============================================================
# SEQUENCES — expected top-level step order, per task
# ============================================================
# Gives "Step 2 of 5", a progress bar and greyed-out upcoming steps. Names
# must match the context.step("...") names in the code exactly. Keys:
# prod_cycle, home, shipment, calib.
# (No "manual:<key>" sequences: the app nests a manual action's steps under its
# own "Manual: <key>" step, so such a sequence never advances.)
sequences:
  prod_cycle:
    - Screw parts
    - Dispense glue
    - Place screen
    - Test screen
    - Pick screen

  home:
    - Move stations to home

  shipment:
    - Move stations to shipment pose

  calib:
    - No calibration for this cell
